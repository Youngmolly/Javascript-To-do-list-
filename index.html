<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1>To-Do List</h1>

    <div class="input-area">
      <input type="text" id="input-tugas" placeholder="Tulis tugas..." autocomplete="off">
      <button id="btn-tambah">Tambah</button>
    </div>

    <p id="pesan-validasi" class="pesan-validasi"></p>

    <div class="stats">
      <span>Total <b id="stat-total">0</b></span>
      <span>Selesai <b id="stat-selesai">0</b></span>
      <span>Belum <b id="stat-belum">0</b></span>
    </div>

    <ul id="daftar-tugas"></ul>

    <p id="pesan-kosong" class="pesan-kosong">Belum ada tugas.</p>
  </div>

  <script src="script.js"></script>
</body>
</html>
